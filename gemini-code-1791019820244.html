<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduViz Voice AI – Demo Voice to Text</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f6f4;
      --card: #ffffff;
      --ink: #1c2b2d;
      --mut: #5f7073;
      --pri: #0f766e;
      --line: #d9e2df;
      --bad: #b91c1c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1719;
        --card: #162124;
        --ink: #e6efed;
        --mut: #9bb0b3;
        --line: #27383b;
        --pri: #2dd4bf;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Be Vietnam Pro', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }
    header {
      padding: 22px 24px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 22px; }
    header p { margin: 4px 0 0; color: var(--mut); font-size: 14px; }
    main { max-width: 800px; margin: 0 auto; padding: 20px; }
    .box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .controls { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
    button {
      padding: 10px 18px;
      border-radius: 6px;
      border: 1px solid var(--pri);
      background: var(--pri);
      color: #fff;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
    }
    button.stop {
      background: var(--bad);
      border-color: var(--bad);
    }
    button.alt {
      background: transparent;
      color: var(--pri);
    }
    #status { font-size: 14px; color: var(--mut); }
    textarea {
      width: 100%;
      height: 220px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      color: var(--ink);
      font: inherit;
      resize: vertical;
    }
    .note { font-size: 13px; color: var(--mut); margin-top: 8px; }
  </style>
</head>
<body>

<header>
  <h1>EduViz Voice AI</h1>
  <p>Demo chuyển đổi giọng nói tiếng Việt thành văn bản trực tiếp trên trình duyệt.</p>
</header>

<main>
  <section class="box">
    <div class="controls">
      <button id="btnStart">🎤 Bắt đầu nói</button>
      <button id="btnStop" class="stop" disabled>⏹️ Dừng lại</button>
      <button id="btnClear" class="alt">🗑️ Xóa văn bản</button>
      <span id="status">Sẵn sàng nhận giọng nói...</span>
    </div>

    <textarea id="resultText" placeholder="Văn bản nhận diện từ giọng nói sẽ xuất hiện ở đây..."></textarea>
    <p class="note">💡 Lưu ý: Tính năng hoạt động tốt nhất trên trình duyệt Google Chrome hoặc Microsoft Edge. Hãy cấp quyền truy cập Microphone khi trình duyệt hỏi.</p>
  </section>
</main>

<script>
  const btnStart = document.getElementById('btnStart');
  const btnStop = document.getElementById('btnStop');
  const btnClear = document.getElementById('btnClear');
  const resultText = document.getElementById('resultText');
  const status = document.getElementById('status');

  // Kiểm tra trình duyệt có hỗ trợ Web Speech API hay không
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    status.textContent = 'Trình duyệt của bạn không hỗ trợ nhận diện giọng nói. Hãy dùng Google Chrome hoặc MS Edge.';
    btnStart.disabled = true;
  } else {
    const recognition = new SpeechRecognition();
    recognition.lang = 'vi-VN'; // Thiết lập ngôn ngữ Tiếng Việt
    recognition.continuous = true; // Nhận diện liên tục
    recognition.interimResults = true; // Hỗ trợ hiển thị kết quả tạm thời khi đang nói

    let finalTranscript = '';

    recognition.onstart = () => {
      status.textContent = '🔴 Đang lắng nghe... Hãy nói vào micro.';
      btnStart.disabled = true;
      btnStop.disabled = false;
    };

    recognition.onerror = (event) => {
      status.textContent = 'Lỗi nhận diện: ' + event.error;
    };

    recognition.onend = () => {
      status.textContent = 'Đã dừng lắng nghe.';
      btnStart.disabled = false;
      btnStop.disabled = true;
    };

    recognition.onresult = (event) => {
      let interimTranscript = '';
      for (let i = event.resultIndex; i < event.results.length; ++i) {
        if (event.results[i].isFinal) {
          finalTranscript += event.results[i][0].transcript + ' ';
        } else {
          interimTranscript += event.results[i][0].transcript;
        }
      }
      resultText.value = finalTranscript + interimTranscript;
    };

    btnStart.onclick = () => {
      finalTranscript = resultText.value ? resultText.value + ' ' : '';
      recognition.start();
    };

    btnStop.onclick = () => {
      recognition.stop();
    };

    btnClear.onclick = () => {
      finalTranscript = '';
      resultText.value = '';
    };
  }
</script>

</body>
</html>
